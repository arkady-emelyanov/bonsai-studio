[package]
name = "bonsai-studio"
version = "1.2.0"
description = "Local runner for Bonsai 27B on llama.cpp"
edition = "2021"
license = "MIT"
repository = "https://github.com/arkady-emelyanov/bonsai-studio"
rust-version = "1.77"

[lib]
name = "bonsai_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
getrandom = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
