<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bonsai Studio</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <div class="brand">
    <h1>Bonsai Studio</h1>
    <p id="model-line">27B on llama.cpp</p>
  </div>
  <div class="control">
    <span id="light" class="light stopped" title="Stopped"></span>
    <button id="open-chat" class="secondary" disabled>Open chat</button>
    <button id="power" class="power">Start</button>
  </div>
</header>

<p id="endpoint" class="endpoint hidden">
  <code id="endpoint-url"></code>
  <button id="endpoint-copy" class="icon-btn" title="Copy endpoint" aria-label="Copy endpoint">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <rect x="5.5" y="5.5" width="8" height="9" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
      <path d="M10.5 3.5v-1a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1V10a1 1 0 0 0 1 1h1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
  </button>
  <span id="endpoint-copied" class="endpoint-copied hidden">Copied</span>
</p>
<p id="status-msg" class="status-msg"></p>
<div id="restart-note" class="restart-note hidden">
  <span>Settings changed. The running server still uses the old ones.</span>
  <button id="restart-btn" class="secondary">Restart</button>
</div>
<div id="alert" class="alert hidden"></div>

<nav class="tabs">
  <button class="tab active" data-tab="model">Model</button>
  <button class="tab" data-tab="workload">Workload</button>
  <button class="tab" data-tab="api">API</button>
  <button class="tab" data-tab="log">Log</button>
</nav>

<section class="panel" data-panel="model">
  <label class="field">
    <span>Variant</span>
    <select id="variant"></select>
  </label>
  <div id="download-row" class="download">
    <div class="download-head">
      <button id="download-btn" class="secondary">Download</button>
      <span id="download-file" class="hint"></span>
      <button id="cancel-btn" class="secondary hidden">Cancel</button>
    </div>
    <div id="download-bar" class="bar hidden"><div id="download-fill"></div></div>
    <span id="download-text" class="hint"></span>
  </div>

  <label class="field">
    <span>Profile</span>
    <select id="profile">
      <option value="default">Default &mdash; 16K, f16 cache (~9 GB)</option>
      <option value="ctx64k">64K &mdash; 4-bit cache (~9.4 GB)</option>
      <option value="ctx100k">100K &mdash; 4-bit cache (~10.1 GB)</option>
      <option value="max">Max &mdash; 262K, 4-bit cache (~12.8 GB)</option>
      <option value="custom">Custom</option>
    </select>
  </label>

  <div class="row">
    <label class="field"><span>Context <em>(tokens)</em></span><input id="ctx" type="number" min="512" step="512" /></label>
    <label class="field"><span>KV cache <em>(4-bit is near-lossless here)</em></span>
      <select id="kv_type"><option value="f16">f16</option><option value="q8_0">q8_0</option><option value="q4_0">q4_0</option></select>
    </label>
    <label class="field"><span>GPU layers <em>(99 = all, 0 = CPU only)</em></span><input id="ngl" type="number" min="0" max="999" title="How many of the model's 64 blocks run in VRAM. Generation is memory-bandwidth bound, so a partial offload is disproportionately slow — leave this at 99 unless the model does not fit." /></label>
  </div>

  <label class="check"><input id="mmproj_cpu" type="checkbox" /> <span>Keep vision tower in system RAM <em>(frees ~0.6 GiB VRAM)</em></span></label>
  <label class="check"><input id="kv_offload" type="checkbox" /> <span>Keep KV cache on the GPU <em>(off is slower, but fits any context)</em></span></label>

  <div id="vram" class="vram"></div>

  <figure id="gpu" class="gpu hidden">
    <figcaption class="gpu-head">
      <span class="gpu-title">GPU memory <em>(all processes)</em></span>
      <span id="gpu-value" class="gpu-value"></span>
    </figcaption>
    <svg id="gpu-plot" class="gpu-plot" viewBox="0 0 320 56" preserveAspectRatio="none"
         role="img" aria-labelledby="gpu-desc">
      <title id="gpu-desc">GPU memory used over the last minute and a half</title>
      <path id="gpu-area" class="gpu-area" d="" />
      <path id="gpu-line" class="gpu-line" d="" />
      <line id="gpu-cursor" class="gpu-cursor" x1="0" y1="0" x2="0" y2="56" style="display:none" />
    </svg>
    <span id="gpu-foot" class="hint"></span>
  </figure>
</section>

<section class="panel hidden" data-panel="workload">
  <label class="field">
    <span>Preset</span>
    <span class="with-button">
      <select id="workload_profile"></select>
      <input id="preset-name" type="text" class="hidden" placeholder="Preset name" maxlength="40" />
      <button id="save-preset" class="secondary" title="Save the values below as a new named preset.">Save as&hellip;</button>
    </span>
  </label>
  <p id="workload-note" class="hint"></p>

  <div class="row">
    <label class="field"><span>Temperature</span><input id="temp" type="number" min="0" max="2" step="0.05" /></label>
    <label class="field"><span>Top-p</span><input id="top_p" type="number" min="0" max="1" step="0.01" /></label>
    <label class="field"><span>Top-k</span><input id="top_k" type="number" min="0" max="500" step="1" /></label>
  </div>
  <div class="row">
    <label class="field"><span>Min-p</span><input id="min_p" type="number" min="0" max="1" step="0.01" /></label>
    <label class="field"><span>Presence penalty</span><input id="presence_penalty" type="number" min="0" max="2" step="0.1" /></label>
    <label class="field"><span>&nbsp;</span><button id="delete-preset" class="secondary hidden">Delete preset</button></label>
  </div>

  <div class="row">
    <label class="field"><span>Thinking</span>
      <select id="reasoning">
        <option value="auto">Auto &mdash; as the model was tuned</option>
        <option value="on">Always</option>
        <option value="off">Off &mdash; faster, weaker on multi-step work</option>
      </select>
    </label>
    <label class="field"><span>Thinking budget <em>(-1 = unlimited)</em></span>
      <input id="reasoning_budget" type="number" min="-1" step="64" title="Token ceiling for the thinking block. The only setting that bounds deliberation directly — temperature and top-p shape what is produced, this bounds how much." />
    </label>
  </div>

  <label class="field"><span>Budget message <em>(shown to the model when the budget runs out)</em></span>
    <input id="reasoning_budget_message" type="text" placeholder="none — the chain is simply cut" />
  </label>
</section>

<section class="panel hidden" data-panel="api">
  <div class="row">
    <label class="field"><span>Port</span><input id="port" type="number" min="1" max="65535" /></label>
    <label class="field"><span>Access</span>
      <select id="bind_lan"><option value="false">This PC only</option><option value="true">My network</option></select>
    </label>
  </div>

  <label class="field"><span>CORS origins</span><input id="cors_origins" type="text" placeholder="*" /></label>
  <label class="field"><span>API key <em>(empty = no authentication)</em></span>
    <span class="with-button"><input id="api_key" type="text" placeholder="none" /><button id="genkey" class="secondary">Generate</button></span>
  </label>

  <div class="field">
    <span>Base URL</span>
    <span class="with-button"><input id="base_url" type="text" readonly /><button id="copy-url" class="secondary">Copy</button></span>
  </div>
</section>

<section class="panel hidden" data-panel="log">
  <pre id="log"></pre>
</section>

<script src="main.js"></script>
</body>
</html>
